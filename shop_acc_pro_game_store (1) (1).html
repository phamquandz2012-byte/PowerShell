<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop AccPro - Store Bán Acc Game Uy Tín</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #5b4bc4;
            --secondary: #a29bfe;
            --dark-bg: #0b0c10;
            --header-bg: #11131e;
            --card-bg: #151828;
            --card-border: rgba(255, 255, 255, 0.08);
            --specs-bg: #1c2035;
            --light: #dfe6e9;
            --text-gray: #9ba0b8;
            --success: #00b894;
            --danger: #ff4757;
            --accent-gold: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0e17;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0e17; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        /* Header Navigation */
        header {
            background: var(--header-bg);
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
            color: #fff;
        }

        .logo span.purple {
            color: var(--primary);
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--secondary);
        }

        .cart-icon-wrapper {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -12px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.8);
        }

        /* Container */
        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
        }

        /* Controls Section */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 18px;
        }

        .search-bar {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-size: 15px;
            background: var(--card-bg);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(108, 92, 231, 0.4);
        }

        .filters-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: var(--card-bg);
            color: var(--light);
            padding: 10px 20px;
            border: 1px solid var(--card-border);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .category-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .sort-wrapper select {
            background: var(--card-bg);
            color: var(--light);
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* Product Grid matching exact Screenshot design */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(108, 92, 231, 0.4);
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .product-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #fff;
            line-height: 1.3;
        }

        /* Specifications Grid inside Card - Matches Screenshot */
        .specs-grid {
            background: var(--specs-bg);
            border-radius: 10px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: #fff;
        }

        .spec-item i {
            color: var(--secondary);
            font-size: 15px;
            width: 16px;
            text-align: center;
        }

        .spec-item .label {
            color: var(--text-gray);
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
        }

        .price {
            font-size: 22px;
            color: var(--success);
            font-weight: 800;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: #fff;
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #00997b; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #e84118; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #16192b;
            padding: 30px;
            border-radius: 16px;
            max-width: 480px;
            width: 90%;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            color: var(--text-gray);
            cursor: pointer;
        }
        .close-modal:hover { color: #fff; }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .auth-tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* MBBank QR Modal Specs */
        .qr-box {
            text-align: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .qr-code-img {
            width: 210px;
            height: 210px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            padding: 6px;
        }

        .bank-info {
            text-align: left;
            font-size: 14px;
            margin-top: 12px;
            line-height: 1.7;
        }

        .bank-info span {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 6px;
            font-size: 12px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--success);
            color: #fff;
            padding: 14px 22px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Footer */
        footer {
            background: var(--header-bg);
            border-top: 1px solid var(--card-border);
            padding: 25px 20px;
            text-align: center;
            margin-top: 50px;
            color: var(--text-gray);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation matching Screenshot -->
    <header>
        <a href="#" class="logo">
            <i class="fa-solid fa-gamepad"></i>
            Shop<span class="purple">AccPro</span>
        </a>
        <nav class="nav-links">
            <a href="#products"><i class="fa-solid fa-store"></i> <span>Sản phẩm</span></a>
            <a href="#" onclick="openModal('authModal')"><i class="fa-solid fa-right-to-bracket"></i> <span>Đăng nhập</span></a>
            <a href="#" onclick="openModal('cartModal')" class="cart-icon-wrapper">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Giỏ hàng</span>
                <span class="cart-badge" id="cartCount">2</span>
            </a>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Controls Bar -->
        <div class="controls-section" id="products">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-bar" id="searchInput" placeholder="Tìm kiếm theo mã acc, server, trang phục...">
            </div>

            <div class="filters-wrapper">
                <div class="category-filter" id="categoryFilter">
                    <button class="category-btn active" data-category="all"><i class="fa-solid fa-border-all"></i> Tất cả</button>
                    <button class="category-btn" data-category="ngoc-rong"><i class="fa-solid fa-dragon"></i> Ngọc Rồng</button>
                    <button class="category-btn" data-category="lien-quan"><i class="fa-solid fa-shield-halved"></i> Liên Quân</button>
                    <button class="category-btn" data-category="freefire"><i class="fa-solid fa-crosshairs"></i> Free Fire</button>
                    <button class="category-btn" data-category="roblox"><i class="fa-solid fa-cube"></i> Roblox</button>
                </div>

                <div class="sort-wrapper">
                    <select id="sortSelect">
                        <option value="default">Sắp xếp: Mặc định</option>
                        <option value="price-asc">Giá: Thấp đến Cao</option>
                        <option value="price-desc">Giá: Cao đến Thấp</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Auth Modal (Login / Register Tabs) -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('authModal')">&times;</span>
            <div class="auth-tabs">
                <button class="auth-tab-btn active" onclick="switchAuthTab('login')">Đăng nhập</button>
                <button class="auth-tab-btn" onclick="switchAuthTab('register')">Đăng ký</button>
            </div>

            <form id="loginForm" onsubmit="handleAuth(event, 'Đăng nhập thành công!')">
                <label style="font-size: 14px; color: var(--text-gray);">Tên đăng nhập hoặc Email</label>
                <input type="text" class="form-control" placeholder="Tên đăng nhập..." required>
                <label style="font-size: 14px; color: var(--text-gray);">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Mật khẩu..." required>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Đăng nhập</button>
            </form>

            <form id="registerForm" style="display: none;" onsubmit="handleAuth(event, 'Đăng ký tài khoản thành công!')">
                <label style="font-size: 14px; color: var(--text-gray);">Tên đăng nhập</label>
                <input type="text" class="form-control" placeholder="Tên đăng nhập..." required>
                <label style="font-size: 14px; color: var(--text-gray);">Email</label>
                <input type="email" class="form-control" placeholder="Địa chỉ email..." required>
                <label style="font-size: 14px; color: var(--text-gray);">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Mật khẩu..." required>
                <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">Đăng ký</button>
            </form>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('cartModal')">&times;</span>
            <h2 style="margin-bottom: 15px; color: var(--secondary);"><i class="fa-solid fa-cart-shopping"></i> Giỏ Hàng</h2>
            <div id="cartItems" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px;">
                <span>Tổng tiền:</span>
                <span id="totalPrice" style="color: var(--success);">0 VNĐ</span>
            </div>
            <button class="btn btn-success" style="width: 100%;" onclick="goToPayment()"><i class="fa-solid fa-qrcode"></i> Thanh Toán Ngay</button>
        </div>
    </div>

    <!-- MBBank Payment Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('paymentModal')">&times;</span>
            <h2 style="margin-bottom: 15px; color: var(--secondary);"><i class="fa-solid fa-qrcode"></i> Thanh Toán MBBank</h2>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=00020101021138570010A00000072701270006970422011303859183535204411153037045802VN5917NGUYEN%20LE%20ANH%20TUAN6005HA%20NOI6304" alt="Mã QR MBBank" class="qr-code-img">
                <div class="bank-info">
                    <p>Ngân hàng: <span>MBBank (Quân Đội)</span></p>
                    <p>Chủ tài khoản: <span>NGUYEN LE ANH TUAN</span></p>
                    <p>Số tài khoản: <span>0385918353</span> 
                        <button class="copy-btn" onclick="copyText('0385918353')"><i class="fa-regular fa-copy"></i> Sao chép</button>
                    </p>
                    <p>Số tiền: <span id="payAmount">0 VNĐ</span></p>
                    <p>Nội dung: <span id="payContent">SHOPACC 101</span> 
                        <button class="copy-btn" onclick="copyText(document.getElementById('payContent').innerText)"><i class="fa-regular fa-copy"></i> Sao chép</button>
                    </p>
                </div>
            </div>
            <button class="btn btn-success" style="width: 100%;" onclick="confirmPayment()"><i class="fa-solid fa-check"></i> Tôi Đã Chuyển Khoản</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Thông báo</span>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopAccPro Game Store. Tất cả quyền được bảo lưu.</p>
    </footer>

    <!-- JavaScript Data & Logic -->
    <script>
        const products = [
            {
                id: 1,
                title: "Acc Ngọc Rồng Server 1 Xayda VIP",
                category: "ngoc-rong",
                price: 350000,
                badge: "HOT",
                image: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Sức Mạnh 80B" },
                    { icon: "fa-chart-line", val: "Lv: 120" },
                    { icon: "fa-user-ninja", val: "Đệ Tử Mabuu" },
                    { icon: "fa-shirt", val: "Đủ Cải Trang" }
                ]
            },
            {
                id: 2,
                title: "Acc Liên Quân Thách Đấu SSS Skin",
                category: "lien-quan",
                price: 1200000,
                badge: "VIP",
                image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Thách Đấu" },
                    { icon: "fa-chart-line", val: "Lv: 30" },
                    { icon: "fa-user-shield", val: "Full Tướng" },
                    { icon: "fa-shirt", val: "Trang phục: 210" }
                ]
            },
            {
                id: 3,
                title: "Acc Roblox Blox Fruits Max Level + CDK",
                category: "roblox",
                price: 280000,
                badge: "HOT",
                image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Level: Max 2550" },
                    { icon: "fa-khanda", val: "Cursed Dual Katana" },
                    { icon: "fa-dragon", val: "Trái Leopard" },
                    { icon: "fa-bolt", val: "Tộc V4 Full Tier" }
                ]
            },
            {
                id: 4,
                title: "Acc Free Fire Top BXH Súng 6 Sao",
                category: "freefire",
                price: 450000,
                badge: "MỚI",
                image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Huyền Thoại" },
                    { icon: "fa-chart-line", val: "Lv: 65" },
                    { icon: "fa-gun", val: "Súng M1014 Chắn" },
                    { icon: "fa-shirt", val: "Đồ Cực Khủng" }
                ]
            },
            {
                id: 5,
                title: "Acc Roblox King Legacy Godhuman",
                category: "roblox",
                price: 190000,
                badge: "",
                image: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Level: Max 4400" },
                    { icon: "fa-wand-magic-sparkles", val: "Soul Guitar" },
                    { icon: "fa-gem", val: "Full Beli & Gems" },
                    { icon: "fa-shield", val: "Acc Trắng TT" }
                ]
            },
            {
                id: 6,
                title: "Acc Liên Quân Cao Thủ Giá Rẻ",
                category: "lien-quan",
                price: 180000,
                badge: "",
                image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80",
                specs: [
                    { icon: "fa-trophy", val: "Cao Thủ" },
                    { icon: "fa-chart-line", val: "Lv: 30" },
                    { icon: "fa-user-shield", val: "Tướng: 85" },
                    { icon: "fa-shirt", val: "Trang phục: 65" }
                ]
            }
        ];

        let cart = JSON.parse(localStorage.getItem('cart_accpro')) || [products[0], products[1]];
        let currentCategory = 'all';

        function displayProducts() {
            const grid = document.getElementById('productGrid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(searchTerm);
                return matchCat && matchSearch;
            });

            if (sortVal === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            if (sortVal === 'price-desc') filtered.sort((a, b) => b.price - a.price);

            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="img-container">
                        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                        <img src="${p.image}" alt="${p.title}">
                    </div>
                    <h3>${p.title}</h3>
                    <div class="specs-grid">
                        ${p.specs.map(s => `
                            <div class="spec-item">
                                <i class="fa-solid ${s.icon}"></i>
                                <span>${s.val}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="price-row">
                        <div class="price">${formatPrice(p.price)}đ</div>
                        <button class="btn" onclick="addToCart(${p.id})">
                            <i class="fa-solid fa-cart-plus"></i> Mua
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            cart.push(prod);
            saveCart();
            showToast(`Đã thêm "${prod.title}" vào giỏ!`);
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('cart_accpro', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const totalPrice = document.getElementById('totalPrice');

            cartCount.innerText = cart.length;

            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: var(--text-gray); padding: 20px;">Giỏ hàng trống.</p>';
                totalPrice.innerText = '0 VNĐ';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.04); margin-bottom: 8px; border-radius: 8px;">
                        <div>
                            <div style="font-weight: 600; font-size: 14px;">${item.title}</div>
                            <div style="color: var(--success); font-size: 13px;">${formatPrice(item.price)} VNĐ</div>
                        </div>
                        <button class="btn btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="removeFromCart(${idx})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            totalPrice.innerText = formatPrice(total) + ' VNĐ';
        }

        function formatPrice(p) {
            return p.toLocaleString('vi-VN');
        }

        function goToPayment() {
            if (cart.length === 0) {
                showToast('Giỏ hàng trống!');
                return;
            }
            closeModal('cartModal');
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('payAmount').innerText = formatPrice(total) + ' VNĐ';
            document.getElementById('payContent').innerText = `SHOPACC${Math.floor(1000 + Math.random() * 9000)}`;
            openModal('paymentModal');
        }

        function confirmPayment() {
            closeModal('paymentModal');
            cart = [];
            saveCart();
            showToast('Đang duyệt đơn hàng của bạn!');
        }

        function switchAuthTab(tab) {
            const loginBtn = document.querySelectorAll('.auth-tab-btn')[0];
            const regBtn = document.querySelectorAll('.auth-tab-btn')[1];
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
            } else {
                regBtn.classList.add('active');
                loginBtn.classList.remove('active');
                regForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        function handleAuth(e, msg) {
            e.preventDefault();
            closeModal('authModal');
            showToast(msg);
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            showToast('Đã sao chép: ' + txt);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.classList.remove('show');
        };

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                displayProducts();
            });
        });

        document.getElementById('searchInput').addEventListener('input', displayProducts);
        document.getElementById('sortSelect').addEventListener('change', displayProducts);

        displayProducts();
        updateCartUI();
    </script>
</body>
</html>
